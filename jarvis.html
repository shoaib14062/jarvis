<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141735">
<title>جارویس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
:root{--bg:#eef1fb;--card:#fff;--text:#1b1f4b;--mute:#5d6290;--acc:#3b3bd8;--accfg:#fff;--line:#d5daf2;--ok:#0f8f6e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141735;--card:#1f2350;--text:#e8e9ff;--mute:#a3a8d8;--acc:#7dd3c0;--accfg:#0d1330;--line:#343a78;--ok:#7dd3c0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141735;--card:#1f2350;--text:#e8e9ff;--mute:#a3a8d8;--acc:#7dd3c0;--accfg:#0d1330;--line:#343a78;--ok:#7dd3c0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html[dir="ltr"],html[dir="ltr"] body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
html[dir="ltr"] .app{line-height:1.3;padding:8px 2px}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",Tahoma,sans-serif;line-height:2.1}
main{max-width:520px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:1.5rem;margin:6px 0 0;text-align:center}
.sub{text-align:center;color:var(--mute);font-size:.85rem;margin:0}
.orb{display:block;margin:22px auto 8px;width:132px;height:132px;border-radius:50%;border:0;background:var(--acc);color:var(--accfg);font-size:3rem;cursor:pointer;box-shadow:0 0 0 10px color-mix(in srgb,var(--acc) 18%,transparent)}
.orb.on{animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 24px color-mix(in srgb,var(--acc) 10%,transparent)}}
@media (prefers-reduced-motion:reduce){.orb.on{animation:none}}
.st{text-align:center;min-height:3.4em;margin:0 0 6px;font-size:1rem}
.row{display:flex;gap:8px;margin:8px 0}
input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:6px 12px;font:inherit;font-size:.95rem}
button.b{border:0;border-radius:12px;background:var(--acc);color:var(--accfg);font:inherit;font-size:.95rem;padding:4px 16px;cursor:pointer}
button.g{background:var(--card);color:var(--text);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.res{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:12px 0}
.res.show{display:block}
.res p{margin:0 0 6px}
.res .b{width:100%}
h2{font-size:1rem;margin:22px 0 4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.app{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:8px 2px 2px;font:inherit;font-size:.72rem;cursor:pointer;line-height:1.6}
.app span{display:block;font-size:1.6rem;line-height:1.3}
ul{list-style:none;margin:0;padding:0;font-size:.85rem;color:var(--mute)}
li{padding:2px 0;border-bottom:1px dashed var(--line)}
.tip{font-size:.8rem;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-top:16px}
.tip b{color:var(--text)}
</style>
</head>
<body>
<main>
<h1 id="t_h1">جارویس</h1>
<p class="sub" id="t_sub">بول کر حکم دیں، میں ایپ کھول دوں گا</p>

<button class="orb" id="mic" aria-label="بولنا شروع کریں">🎙️</button>
<p class="st" id="st">مائیک دبائیں اور بولیں</p>

<div class="row">
<input id="txt" placeholder="یا یہاں لکھیں: واٹس ایپ کھولو" enterkeyhint="go" autocomplete="off">
<button class="b" id="go">چلاؤ</button>
</div>
<div class="row">
<button class="b g" id="lang" style="flex:1">زبان: اردو</button>
<button class="b g" id="theme" style="flex:1">رنگ بدلیں</button>
</div>

<div class="res" id="res">
<p id="rtxt"></p>
<button class="b" id="rgo">کھولیں</button>
</div>

<h2 id="t_a">فوری ایپس</h2>
<div class="grid" id="grid"></div>

<h2 id="t_b">آخری احکامات</h2>
<ul id="hist"><li>ابھی کوئی نہیں</li></ul>

<div class="tip" id="tip">
<b>مثالیں:</b><br>
کروم کھولو · ٹیلی گرام کھولو<br>
گوگل پر پاکستان کا موسم سرچ کرو<br>
یوٹیوب پر نعت سرچ کرو<br>
واٹس ایپ پر 0300 1234567 کو میسج بھیجو کہ میں آ رہا ہوں<br>
کال کرو 0300 1234567 · کیمرہ کھولو
</div>
</main>

<script>
(function(){
var APPS=[
{en:"WhatsApp",n:"واٹس ایپ",e:"💬",p:"com.whatsapp",a:["واٹس ایپ","واٹسایپ","وٹس ایپ","واٹس اپ","whatsapp","whats app"]},
{en:"Telegram",n:"ٹیلی گرام",e:"✈️",p:"org.telegram.messenger",a:["ٹیلی گرام","ٹیلیگرام","ٹیلی گرم","telegram"]},
{en:"Chrome",n:"کروم",e:"🌐",p:"com.android.chrome",a:["کروم","chrome","براؤزر","browser"]},
{en:"YouTube",n:"یوٹیوب",e:"▶️",p:"com.google.android.youtube",a:["یوٹیوب","یو ٹیوب","youtube"]},
{en:"Facebook",n:"فیس بک",e:"📘",p:"com.facebook.katana",a:["فیس بک","فیسبک","facebook"]},
{en:"Instagram",n:"انسٹاگرام",e:"📷",p:"com.instagram.android",a:["انسٹا گرام","انسٹاگرام","instagram"]},
{en:"TikTok",n:"ٹک ٹاک",e:"🎵",p:"com.zhiliaoapp.musically",a:["ٹک ٹاک","ٹکٹاک","tiktok","tik tok"]},
{en:"Snapchat",n:"سنیپ چیٹ",e:"👻",p:"com.snapchat.android",a:["سنیپ چیٹ","سنیپ","snapchat"]},
{en:"Gmail",n:"جی میل",e:"✉️",p:"com.google.android.gm",a:["جی میل","جیمیل","gmail"]},
{en:"Messenger",n:"میسنجر",e:"🗨️",p:"com.facebook.orca",a:["میسنجر","messenger"]},
{en:"X (Twitter)",n:"ایکس",e:"🐦",p:"com.twitter.android",a:["ٹوئٹر","ٹویٹر","twitter"]},
{en:"Netflix",n:"نیٹ فلکس",e:"🎬",p:"com.netflix.mediaclient",a:["نیٹ فلکس","netflix"]},
{en:"Spotify",n:"اسپاٹیفائی",e:"🎧",p:"com.spotify.music",a:["اسپاٹیفائی","spotify"]},
{en:"Play Store",n:"پلے اسٹور",e:"🛍️",p:"com.android.vending",a:["پلے اسٹور","پلے سٹور","play store","playstore"]},
{en:"JazzCash",n:"جاز کیش",e:"💰",p:"com.techlogix.mobilinkcustomer",a:["جاز کیش","jazzcash","jazz cash"]},
{en:"Easypaisa",n:"ایزی پیسہ",e:"💵",p:"pk.com.telenor.phoenix",a:["ایزی پیسہ","ایزی پیسے","easypaisa","easy paisa"]},
{en:"Maps",n:"میپس",e:"🗺️",p:"com.google.android.apps.maps",a:["نقشہ","میپس","میپ","maps","map"]},
{en:"Camera",n:"کیمرہ",e:"📸",u:"intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end",a:["کیمرہ","کیمرا","camera"]},
{en:"Settings",n:"سیٹنگز",e:"⚙️",u:"intent://#Intent;action=android.settings.SETTINGS;end",a:["سیٹنگ","سیٹنگز","settings"]},
{en:"Phone",n:"فون",e:"📞",u:"tel:",a:["ڈائلر","dialer"]}
];
var $=function(i){return document.getElementById(i)};
var L="ur",lang="ur-PK",pending=null,hist=[];
try{var sv=localStorage.getItem("jv_lang");if(sv==="en"||sv==="ur")L=sv}catch(e){}
var TX={
ur:{title:"جارویس",sub:"بول کر حکم دیں، میں ایپ کھول دوں گا",idle:"مائیک دبائیں اور بولیں",ph:"یا یہاں لکھیں: واٹس ایپ کھولو",go:"چلاؤ",lang:"Switch to English",theme:"رنگ بدلیں",open:"کھولیں",apps:"فوری ایپس",hist:"آخری احکامات",none:"ابھی کوئی نہیں",mic:"بولنا شروع کریں",
listen:"سن رہا ہوں…",nospeech:"کچھ سنائی نہیں دیا، دوبارہ کوشش کریں",nosr:"یہ براؤزر آواز نہیں سمجھتا۔ کروم میں کھولیں۔",again:"دوبارہ دبائیں",err:"خرابی: ",
errs:{"not-allowed":"مائیک کی اجازت دیں (کروم سیٹنگز ← سائٹ سیٹنگز ← مائیکروفون)","no-speech":"کچھ سنائی نہیں دیا","network":"انٹرنیٹ چیک کریں","audio-capture":"مائیک نہیں ملا"},
tip:"<b>مثالیں:</b><br>کروم کھولو · ٹیلی گرام کھولو<br>گوگل پر پاکستان کا موسم سرچ کرو<br>یوٹیوب پر نعت سرچ کرو<br>واٹس ایپ پر 0300 1234567 کو میسج بھیجو کہ میں آ رہا ہوں<br>کال کرو 0300 1234567 · کیمرہ کھولو"},
en:{title:"Jarvis",sub:"Speak a command and I will open the app",idle:"Tap the mic and speak",ph:"Or type: open WhatsApp",go:"Go",lang:"اردو میں بدلیں",theme:"Switch theme",open:"Open",apps:"Quick apps",hist:"Recent commands",none:"None yet",mic:"Start speaking",
listen:"Listening…",nospeech:"Did not hear anything, try again",nosr:"This browser cannot recognise speech. Open it in Chrome.",again:"Tap again",err:"Error: ",
errs:{"not-allowed":"Allow the microphone (Chrome settings > Site settings > Microphone)","no-speech":"Did not hear anything","network":"Check your internet connection","audio-capture":"No microphone found"},
tip:"<b>Examples:</b><br>open Chrome · open Telegram<br>search weather in Lahore on Google<br>search naat on YouTube<br>send message to 0300 1234567 saying I am coming<br>call 0300 1234567 · open camera"}
};
function T(k){return TX[L][k]}
function ui(ur,en){return L==="ur"?ur:en}
function setUI(){
var d=document.documentElement;
d.lang=L;d.dir=L==="ur"?"rtl":"ltr";
lang=L==="ur"?"ur-PK":"en-US";
$("t_h1").textContent=T("title");$("t_sub").textContent=T("sub");
$("st").textContent=T("idle");$("txt").placeholder=T("ph");$("go").textContent=T("go");
$("lang").textContent=T("lang");$("theme").textContent=T("theme");$("rgo").textContent=T("open");
$("t_a").textContent=T("apps");$("t_b").textContent=T("hist");$("tip").innerHTML=T("tip");
$("mic").setAttribute("aria-label",T("mic"));
document.title=T("title");
var an=document.querySelectorAll(".app");
for(var i=0;i<an.length;i++){an[i].lastChild.nodeValue=L==="ur"?APPS[i].n:APPS[i].en}
renderHist();
}

function appUrl(a){
if(a.u)return a.u;
return "intent://#Intent;package="+a.p+";S.browser_fallback_url="+encodeURIComponent("https://play.google.com/store/apps/details?id="+a.p)+";end";
}
function norm(s){
return s.toLowerCase().replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/ۃ/g,"ہ")
.replace(/[\u064B-\u065F\u0670]/g,"")
.replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)})
.replace(/[؟،۔.!?,]/g," ").replace(/\s+/g," ").trim();
}
var STOP=["گوگل","google","سرچ","search","تلاش","ڈھونڈو","ڈھونڈ","کرو","کریں","کرنا","کر","دو","دیں","پر","میں","کے","کی","کا","لیے","لئے","مجھے","میرے","میرا","جاؤ","جاو","یوٹیوب","youtube","اور","ذرا","پلیز","چلاؤ","لگاؤ","for","on","the","please","open","launch","play","find","look","up","to","in","about","me","my","a","an","and","can","you","go"];
function cleanQuery(t,extra){
var drop=STOP.concat(extra||[]);
return t.split(" ").filter(function(w){return w&&drop.indexOf(w)<0}).join(" ");
}
function fixNum(n){
n=n.replace(/\D/g,"");
if(n.indexOf("00")===0)n=n.slice(2);
else if(n.charAt(0)==="0")n="92"+n.slice(1);
return n;
}
function findNum(t){
var m=t.match(/\+?\d[\d\s\-]{7,}\d/);
return m?m[0]:"";
}
function findApp(t){
for(var i=0;i<APPS.length;i++)for(var j=0;j<APPS[i].a.length;j++)
if(t.indexOf(norm(APPS[i].a[j]))>-1)return APPS[i];
return null;
}
function has(t,list){return list.some(function(w){return t.indexOf(w)>-1})}

function parse(raw){
var t=norm(raw),num=findNum(t),app=findApp(t);
var isOpen=has(t,["کھول","کھولو","کھولیں","اوپن","open","لانچ","launch","چلا"]);
var isSearch=has(t,["سرچ","search","تلاش","ڈھونڈ","گوگل","google"]);

if(has(t,["کال","فون کرو","call","ڈائل"])&&num)
return {say:ui("کال ملا رہا ہوں","Calling now"),url:"tel:"+num.replace(/[^\d+]/g,"")};

if(has(t,["میسج","پیغام","message","بھیج","send","sms"])&&num){
var body="",bm=t.match(/(?:لکھو|لکھیں|لکھ دو|کہو|کہ دو|کہ|saying|that says|say)\s+(.+)$/);
if(bm)body=bm[1];
var n=fixNum(num);
if(app&&app.p==="com.whatsapp"||t.indexOf("واٹس")>-1)
return {say:ui("واٹس ایپ پر میسج تیار ہے","WhatsApp message is ready"),url:"https://wa.me/"+n+"?text="+encodeURIComponent(body)};
return {say:ui("میسج تیار ہے","Message is ready"),url:"sms:"+num.replace(/[^\d+]/g,"")+"?body="+encodeURIComponent(body)};
}

if(app&&app.p==="com.google.android.youtube"&&(isSearch||has(t,["چلاؤ","play"]))){
var q=cleanQuery(t);
if(q)return {say:ui("یوٹیوب پر "+q+" ڈھونڈ رہا ہوں","Searching YouTube for "+q),url:"https://www.youtube.com/results?search_query="+encodeURIComponent(q)};
}

if(has(t,["راستہ","directions","نقشہ","میپ","map"])&&!isOpen){
var mq=cleanQuery(t,["راستہ","نقشہ","میپ","maps","map","directions","دکھاؤ","کا","تک"]);
if(mq)return {say:ui(mq+" نقشے پر ڈھونڈ رہا ہوں","Finding "+mq+" on the map"),url:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(mq)};
}

if(isSearch&&!(app&&isOpen&&!has(t,["سرچ","search","تلاش"]))){
var gq=cleanQuery(t,app?app.a.map(norm):[]);
if(gq)return {say:ui("گوگل پر "+gq+" ڈھونڈ رہا ہوں","Searching Google for "+gq),url:"https://www.google.com/search?q="+encodeURIComponent(gq)};
}

if(app)return {say:ui(app.n+" کھول رہا ہوں","Opening "+app.en),url:appUrl(app)};

if(t)return {say:ui("سمجھ نہیں آیا، گوگل پر ڈھونڈ لوں؟","Did not understand. Search Google for it?"),url:"https://www.google.com/search?q="+encodeURIComponent(t),soft:true};
return null;
}

function speak(s){
try{var u=new SpeechSynthesisUtterance(s);u.lang=lang;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function go(url){try{window.location.href=url}catch(e){}}
function renderHist(){
var u=$("hist");u.innerHTML="";
if(!hist.length){var e=document.createElement("li");e.textContent=T("none");u.appendChild(e);return}
hist.forEach(function(h){var li=document.createElement("li");li.textContent=h;u.appendChild(li)});
}
function addHist(s){hist.unshift(s);hist=hist.slice(0,6);renderHist()}
function run(raw){
raw=(raw||"").trim();
if(!raw)return;
var r=parse(raw);
if(!r){$("st").textContent=T("nospeech");return}
addHist(raw);
$("st").textContent=r.say;
$("rtxt").textContent=r.say;
$("res").className="res show";
pending=r.url;
if(!r.soft){speak(r.say);setTimeout(function(){go(r.url)},700)}
}

$("rgo").onclick=function(){if(pending)go(pending)};
$("go").onclick=function(){run($("txt").value);$("txt").value=""};
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter"){$("go").click()}});

$("lang").onclick=function(){
L=L==="ur"?"en":"ur";
try{localStorage.setItem("jv_lang",L)}catch(e){}
setUI();
};
$("theme").onclick=function(){
var d=document.documentElement,cur=d.getAttribute("data-theme");
if(!cur)cur=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
d.setAttribute("data-theme",cur==="dark"?"light":"dark");
};

var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,on=false;
$("mic").onclick=function(){
if(!SR){$("st").textContent=T("nosr");return}
if(on){try{rec.stop()}catch(e){}return}
rec=new SR();rec.lang=lang;rec.interimResults=true;rec.maxAlternatives=1;
var finalText="";
rec.onstart=function(){on=true;$("mic").classList.add("on");$("st").textContent=T("listen")};
rec.onresult=function(e){
var s="";
for(var i=0;i<e.results.length;i++){s+=e.results[i][0].transcript;if(e.results[i].isFinal)finalText=s}
$("st").textContent=s;
};
rec.onerror=function(e){
$("st").textContent=T("errs")[e.error]||T("err")+e.error;
};
rec.onend=function(){on=false;$("mic").classList.remove("on");if(finalText)run(finalText)};
try{rec.start()}catch(e){$("st").textContent=T("again")}
};

var g=$("grid");
APPS.forEach(function(a){
var b=document.createElement("button");
b.className="app";
var sp=document.createElement("span");sp.textContent=a.e;
b.appendChild(sp);b.appendChild(document.createTextNode(a.n));
b.onclick=function(){go(appUrl(a))};
g.appendChild(b);
});
setUI();
})();
</script>
</body>
</html>
